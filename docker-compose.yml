services:

  tradebot:
    build: .
    container_name: tradebot_app
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/trading_bot.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build: .
    container_name: tradebot_dashboard
    entrypoint: ["python", "dashboard.py"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/trading_bot.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      - tradebot
    restart: unless-stopped
